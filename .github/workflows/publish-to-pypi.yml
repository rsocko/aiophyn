name: Publish Python 🐍 distribution 📦 to PyPI

on:
  release:
    types: [published]

jobs:
  build_and_publish:
    name: Build and publish Python distribution to PyPI
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: Install dependencies
      run: |
        pip install build twine --break-system-packages

    - name: Build distribution
      run: python -m build

    - name: Smoke test built wheel dependencies
      run: |
        pip install dist/*.whl --break-system-packages
        python -c "import aiophyn"
        python -c "from aiophyn.mqtt import MQTTClient"
        python -c "from aiophyn.partners.kohler import KOHLER_API"
        python -c "import paho.mqtt.client"
        python -c "import socks"
        python -c "from Crypto.Cipher import AES"

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: twine upload dist/*
