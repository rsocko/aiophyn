name: Publish Python 🐍 distribution 📦 to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build_and_publish:
    name: Build and publish Python distribution to PyPI
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Poetry
      run: pipx install poetry==2.2.1

    - name: Install locked dependencies
      run: |
        poetry env use "$(command -v python)"
        poetry check --lock
        poetry sync --with dev

    - name: Run offline tests
      run: |
        poetry run python -m pip check
        poetry run python -m pytest tests

    - name: Build and verify distributions outside the checkout
      run: poetry run python scripts/verify_distribution.py --output-dir dist

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: poetry run twine upload dist/*
