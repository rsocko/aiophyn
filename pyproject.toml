[project]
name = "aiophyn"
version = "2026.9.1"
requires-python = ">=3.9,<4.0"
dynamic = ["dependencies"]
description = "An asynchronous library for Phyn Smart Water devices"
authors = [ 
    { name="MizterB", email="5458030+MizterB@users.noreply.github.com" },
    { name="jordanruthe", email="31575189+jordanruthe@users.noreply.github.com" },
]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
pycognito = "^2024.5.1"
aiohttp = "^3.8.1"
boto3 = "^1.20.24"
paho-mqtt = ">=2.0.0,<3.0.0"
pysocks = ">=1.7.1,<2.0.0"
pycryptodome = ">=3.20.0,<4.0.0"


[tool.poetry.group.dev.dependencies]
pytest = ">=8.4,<9"
pytest-asyncio = ">=1.2,<1.3"
build = ">=1.2.2,<2"
twine = ">=6.1,<7"
tomli = { version = ">=2,<3", python = "<3.11" }

[build-system]
requires = ["poetry-core>=2.2,<3"]
build-backend = "poetry.core.masonry.api"

[project.urls]
Homepage = "https://github.com/jordanruthe/aiophyn"
Issues = "https://github.com/jordanruthe/aiophyn/issues"
